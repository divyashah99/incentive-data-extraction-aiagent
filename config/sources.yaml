    url: "https://rebuildingfortomorrow.hcfl.gov/en-US/H/SFH/?id=cf6516e0-9f24-f111-8341-7ced8d6f4b5b"
    rate_limit_seconds: 1.5
    js_wait_seconds: 5               # Power Pages — needs full settle for accordions
    js_expand_accordions: true       # expand collapsed <details> / Bootstrap collapse panes
    scrape_notes: >
      CDBG-DR Homeowner Repair & Reconstruction Program (HRRP) — disaster recovery
      grants for homes damaged by Hurricanes Helene & Milton. Single-family homeowners.
      Applications opened May 2026. Microsoft Power Pages site; requires Playwright.
      Three award tiers (repair / reconstruction / reimbursement) live in accordions;
      js_expand_accordions=true ensures all tiers are captured.
    scope: disaster
    format: html
    refresh_cadence: weekly
    discovered_at: 2026-06-03
    discovered_by: human
    owner: scraper-team

