# Per spec v2.7 §9.5: the registry is an open set sorted by operational
# needs (stale fetch, quarantine rate), not a static priority. Use
# `status: active|candidate|deprecated` to control whether a source runs.
#
# extraction_method controls how content is parsed after fetching:
#   direct  → already structured JSON/data, fields mapped without any parser
#   table   → page has clean HTML tables; BS4 table parser (no LLM, fast & cheap)
#   llm     → prose / inconsistent layout; send to Groq/Gemini for extraction
#
# sheet_group (optional) — Excel output groups multiple sources into one sheet.
#   Use the same value across related sources (e.g. all teco_* -> "Tampa Electric").
#   If omitted, the source gets its own sheet keyed by `id`.

sources:

