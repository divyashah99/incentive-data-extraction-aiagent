  - id: duke_energy_florida
    name: "Duke Energy Florida — Home Energy Rebates Hub"
    type: js_rendered                # Akamai/WAF blocks plain requests with 403
    extraction_method: llm           # no tables; FAQ prose has all rebate amounts
    status: active
    sheet_group: "Duke Energy Florida"
    url: "https://www.duke-energy.com/home/products/florida-savings"
    rate_limit_seconds: 1.0
    scrape_notes: >
      Plain HTTP returns 403 (WAF/bot detection) — use Playwright. FAQ section has
      all rebate amounts visible after render. ~3,700 chars.
      Key amounts: Home Energy Improvement up to $3,800 total
      (single-family: HVAC $1,000, windows $800, attic $800, ducts $450;
      multifamily: HVAC $600, attic $350; manufactured: HVAC $600, ducts $450).
      EnergyWise Home: up to $141/yr bill credits.
    scope: energy
    format: html
    refresh_cadence: weekly
    discovered_at: 2026-06-03
    discovered_by: human
    owner: scraper-team

