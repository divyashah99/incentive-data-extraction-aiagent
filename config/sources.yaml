    api_params:
      state: 12
      length: 50
    rate_limit_seconds: 1.0
    scrape_notes: "DSIRE DataTables API returns clean JSON. No LLM needed."
    scope: energy
    format: table
    refresh_cadence: weekly
    discovered_at: 2026-06-03
    discovered_by: human
    owner: scraper-team

